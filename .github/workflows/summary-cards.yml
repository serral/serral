name: Generate Profile Summary Cards

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pinned to an immutable commit SHA. `@release` is a force-pushable branch,
      # so it silently re-resolved on every scheduled run.
      - uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # v0.12.0
        with:
          USERNAME: serral
          # BRANCH_NAME: main
          # UTC_OFFSET: 0
          # EXCLUDE: html,css
          # EXCLUDE_REPOS: some-repo,owner/other-repo
          THEME: github_dark
          # ANIMATION: fade
          # DURATION: 2
          # NAME: Andre Serralheiro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
